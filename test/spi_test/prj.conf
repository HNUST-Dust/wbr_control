CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_DEBUG=y
CONFIG_SERIAL=y
CONFIG_DEBUG_INFO=y
CONFIG_MULTITHREADING=y

CONFIG_SPI=y
CONFIG_SPI_HPMICRO=y
CONFIG_SPI_HPM_SPI_DMA=n
CONFIG_SPI_HPM_SPI_INTERRUPT=n

# Keep startup diagnostics on the direct UART console path. Enabling the
# immediate logger at DEBUG level can emit from GPIO/SPI initialization before
# UART0 is ready.
CONFIG_BOOT_BANNER=y
CONFIG_LOG=n
CONFIG_CHERRYUSB=n
