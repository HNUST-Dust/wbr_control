# Diagnostic variant of the main application: retain RTT and the real
# SysStateModule, but remove every earlier runtime service and other module.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_HPM67_DOUBLE_PRECISION_FPU=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_ZBUS=y
CONFIG_RING_BUFFER=y

CONFIG_WBR_CONTROL_RTT_DIAGNOSTICS=y

CONFIG_WBR_CONTROL_RUNTIME_INIT_CAN=n
CONFIG_WBR_CONTROL_RUNTIME_INIT_USB=n
CONFIG_WBR_CONTROL_RUNTIME_INIT_LITTLEFS=n
CONFIG_WBR_CONTROL_PC_LINK=n

CONFIG_WBR_CONTROL_MODULE_REMOTE_INPUT=n
CONFIG_WBR_CONTROL_MODULE_CHASSIS=n
CONFIG_WBR_CONTROL_MODULE_REFEREE=n
CONFIG_WBR_CONTROL_MODULE_HI91_IMU=n
CONFIG_WBR_CONTROL_MODULE_AHRS=n
CONFIG_WBR_CONTROL_MODULE_SYS_STATE=y

CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n
CONFIG_BOOT_BANNER=n

CONFIG_STDOUT_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BLOCK_IN_THREAD=n
