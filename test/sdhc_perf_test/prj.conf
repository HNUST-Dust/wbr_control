# Text diagnostics are configured by ../common/rtt.conf. UART0 is VOFA-only.
CONFIG_SDHC_LOG_LEVEL_INF=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_SDMMC_VOLUME_NAME="SD"
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
# Never format a card automatically if mounting fails.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n
CONFIG_TIMING_FUNCTIONS=y
CONFIG_MAIN_STACK_SIZE=4096

# This test does not use USB.
CONFIG_CHERRYUSB=n
