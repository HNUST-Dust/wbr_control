# Chassis parameters are converted to constexpr C++ during the build.
# Keep units in field names and change schema_version when the format changes.
schema_version: 1

mechanics:
  wheel_reduction: 15.764705882352942
  wheel_radius_m: 0.058
  half_wheel_track_m: 0.215
  gravity_mps2: 9.80665
  robot_mass_kg: 12.054
  leg_geometry_m:
    ab: 0.0945
    bc: 0.1125
    cd: 0.116
    ad: 0.090
    ag: 0.210
    gh: 0.250

