# T2: Star topology, application is the manifest repository.
# rm_test is the manifest repository (application-as-manifest).
#
# West workspace configuration (.west/config):
#   [manifest]
#   path = rm_test
#   file = west.yml

########################################
##  zephyr                    v3.7.0  ##
##  hpm_sdk                   v1.11.0 ##
########################################
manifest:
  version: "1.0"

  remotes:
    - name: github
      url-base: https://github.com/hpmicro
    - name: cherry-embedded
      url-base: https://github.com/cherry-embedded/
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: dust-mavlink
      url-base: https://github.com/NoneOfEver
    - name: dust-hpm
      url-base: https://github.com/NoneOfEver
    # Eigen 官方仓库在 GitLab（GitHub 的 eigenteam/eigen-git-mirror 已停更在 3.3.7）。
    - name: eigen
      url-base: https://gitlab.com

  defaults:
    remote: github

  projects:
    # Zephyr RTOS. Third-party projects are declared explicitly below so every
    # repository can live directly under the workspace root.
    - name: zephyr
      remote: github
      repo-path: zephyr
      revision: zsg_v0.7.0
      west-commands: scripts/west-commands.yml

    - name: littlefs
      remote: upstream
      repo-path: littlefs
      path: littlefs
      revision: 408c16a909dd6cf128874a76f21c793798c9e423

    # HPMicro SDK (manifest repo with boards, drivers, soc, dts)
    - name: hpm_support
      remote: dust-hpm
      repo-path: hpm_support
      path: hpm_support
      revision: main
      west-commands: scripts/west-commands.yml

    - name: CherryUSB
      remote: cherry-embedded
      repo-path: CherryUSB
      path: CherryUSB
      revision: 5ffe9cbe7fb41489d99806daa8572124ace1b99b

    # Mavlink generated headers
    - name: dust_mavlink
      remote: dust-mavlink
      repo-path: dust_mavlink
      path: mavlink
      revision: main

    # Eigen：纯头文件线性代数库（MPL-2.0），用于状态估计 / MPC / 坐标系变换。
    # 3.4.0 为当前最新稳定版，对应 commit 3147391d946bb4b6c68edd901f2add6ac1f31f8c。
    - name: eigen
      remote: eigen
      repo-path: libeigen/eigen
      path: eigen
      revision: 3.4.0

  self:
    path: wbr_control
